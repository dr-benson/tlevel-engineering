<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr Benson's Prefix Panic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f7; --ink:#535353; --soft:#acacac; --faint:#e2e2e2; --sail:#ffffff;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#202124;--ink:#bdc1c6;--soft:#6b6f74;--faint:#34373b;--sail:#e8eaed;}
}
:root[data-theme="dark"]{--bg:#202124;--ink:#bdc1c6;--soft:#6b6f74;--faint:#34373b;--sail:#e8eaed;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.pix{font-family:"Press Start 2P",ui-monospace,"Courier New",monospace}

/* the whole game is one screen: header, HUD, then the play area takes what's left */
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px;
  height:100%;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
h1{font-size:clamp(11px,2.4vw,18px);margin:0;font-weight:400;line-height:1.4}
.levels{display:flex;gap:6px}
.levels button{font:inherit;font-size:9px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);padding:7px 8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.levels button i{display:block;width:8px;height:8px}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid #2f8fd1;outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between;font-size:10px}
.hud > div{display:flex;align-items:center;gap:8px}
.bar{width:96px;height:12px;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;transition:width .25s;
  background:repeating-linear-gradient(90deg,#e8508a 0 6px,#f2c230 6px 12px,#2f8fd1 12px 18px,#3fae6a 18px 24px,#f07a2a 24px 30px)}
#score{font-size:14px;min-width:4ch}
.streak{color:#f07a2a}
.lives{display:inline-flex;gap:4px;margin-right:8px}
.lives i{display:block;width:10px;height:10px;background:#e8508a;box-shadow:0 0 0 2px var(--ink)}
.lives i.lost{background:var(--faint)}
.flash{animation:fl .5s steps(2) 1}
@keyframes fl{50%{opacity:.2}}

.main{min-height:0;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(270px,360px);grid-template-rows:minmax(0,1fr)}
.main.idle{grid-template-columns:minmax(0,1fr)}
.stage{position:relative;min-height:0;min-width:0;border:2px solid var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:10px;pointer-events:none;overflow:auto}
.msg[hidden]{display:none}
.msg .big{font-family:"Press Start 2P",ui-monospace,monospace;font-size:clamp(10px,2.2vw,14px);line-height:1.7;margin:0 0 6px;background:var(--bg);padding:2px 8px}
.msg .small{margin:2px 0;font-size:clamp(14px,2.4vw,16px);max-width:48ch;background:var(--bg);padding:1px 8px}
.tally{display:grid;grid-template-columns:auto auto;gap:2px 18px;background:var(--bg);padding:6px 12px;margin:4px 0;font-size:15px;text-align:left}
.tally b{font-family:"Press Start 2P",ui-monospace,monospace;font-weight:400;font-size:11px;text-align:right;align-self:center}
.tally .tot{border-top:2px solid var(--ink);padding-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.btn{pointer-events:auto;font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;padding:10px 12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* question panel: a column beside the grid on wide screens */
.quiz{min-height:0;min-width:0;overflow:auto;border:2px solid var(--ink)}
.quiz[hidden]{display:none}
.card{padding:14px}
.card.pop{animation:pop .18s steps(3) 1}
@keyframes pop{0%{transform:translateY(4px)}100%{transform:none}}
.clue{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.step{font-size:9px;color:var(--soft);width:100%;display:flex;justify-content:space-between}
.cv{font-size:clamp(15px,2vw,20px);margin:0;line-height:1.5}
.kind{font-size:14px}
.tries{color:var(--ink)}
.ask{margin:8px 0 0;font-size:16px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.opts[hidden],.conv[hidden],.go[hidden]{display:none}
.opt{font-family:"Press Start 2P",ui-monospace,monospace;font-size:12px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:46px;text-align:left;touch-action:manipulation;min-width:0}
.opt sup.pw{font-size:10px}
.opt span{padding-block:6px;margin-block:-6px} /* room for raised powers inside the clipped label */
.opt b{flex:none;width:22px;height:22px;display:grid;place-items:center;color:#fff;font-weight:400;font-size:10px}
.opt span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.aim{outline:4px dashed currentColor;outline-offset:-2px}
.stage{cursor:crosshair}
.opt.ok{outline:4px solid #3fae6a;outline-offset:-2px}
.opt.no{outline:4px solid #d94040;outline-offset:-2px;opacity:.55}
.opt.shake{animation:shake .3s steps(4) 1}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.conv{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
.fld{display:flex;align-items:center;gap:6px}
.fld label{font-size:12px}
.fld input{font-family:"Press Start 2P",ui-monospace,monospace;font-size:16px;width:6.5ch;padding:8px 6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:0}
.fld input.bad{border-color:#d94040}
.fld .u{font-size:12px}
/* a chunky, centred minus sign so negatives can't be missed in the pixel font */
.neg{display:inline-block;width:.75em;height:.22em;min-height:2px;background:currentColor;vertical-align:.33em;margin:0 .14em 0 .06em}
.neg .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fb{min-height:1.6em;line-height:1.5;margin:12px 0 0;padding-left:10px;border-left:4px solid transparent;font-size:15px}
.fb.good{border-color:#3fae6a}
.fb.hint{border-color:#f2c230}
.fb.bad{border-color:#d94040}
.fb .w{display:block;font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;line-height:2;margin-top:4px}
.go{margin-top:10px}
.cd{height:8px;border:2px solid var(--ink)}
.cd i{display:block;height:100%;width:100%;background:var(--ink)}

/* narrow or portrait screens: grid on top, question underneath */
@media (max-width: 600px), (max-aspect-ratio: 5/4){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(170px,54%) minmax(0,1fr);gap:8px}
  .main.idle{grid-template-rows:minmax(0,1fr)}
  .opts{grid-template-columns:1fr 1fr}
}
@media (max-width: 560px){
  .wrap{padding:8px 10px;gap:6px}
  .head{gap:6px}
  h1{font-size:11px;width:100%}
  .levels{width:100%}
  .levels button{flex:1;justify-content:center;font-size:8px;padding:6px 4px}
  .hud{font-size:8px;gap:4px 10px}
  .bar{width:56px;height:10px}
  #score{font-size:11px}
  .card{padding:10px}
  .cv{font-size:15px}
  .kind{font-size:13px}
  .ask{font-size:14px;margin-top:4px}
  .opts{gap:6px;margin-top:8px}
  .opt{font-size:9px;padding:8px 6px;gap:6px;min-height:42px}
  .opt sup.pw{font-size:8px}
  .opt b{width:18px;height:18px;font-size:8px}
  .fb{font-size:14px;margin-top:8px}
  .fb .w{font-size:8px}
  .conv{gap:8px 10px;margin-top:8px}
  .msg .small{font-size:14px}
}
/* short landscape screens (phones on their side, small laptops) */
@media (max-height: 520px) and (min-aspect-ratio: 5/4){
  .wrap{padding:6px 10px;gap:6px}
  h1{font-size:11px}
  .levels button{font-size:8px;padding:4px 6px}
  .hud{font-size:8px}
  .bar{height:10px}
  #score{font-size:11px}
  .card{padding:8px 10px}
  .cv{font-size:14px}
  .ask{font-size:13px;margin-top:2px}
  .opts{gap:5px;margin-top:6px}
  .opt{font-size:9px;min-height:34px;padding:5px 8px}
  .opt sup.pw{font-size:8px}
  .opt b{width:18px;height:18px;font-size:8px}
  .fb{font-size:13px;margin-top:6px}
  .fb .w{font-size:8px;line-height:1.8}
}
.hs{border-collapse:collapse;background:var(--bg);margin:8px 0 4px;font-size:14px;border:2px solid var(--ink)}
.hs caption{font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;padding:0 0 6px;background:var(--bg)}
.hs th,.hs td{padding:3px 10px;text-align:right;white-space:nowrap}
.hs thead th{font-weight:400;font-size:12px;color:var(--soft);border-bottom:2px solid var(--ink)}
.hs tbody th,.hs tfoot th{text-align:left;font-weight:700}
.hs tbody th i{display:inline-block;width:9px;height:9px;margin-right:6px}
.hs td{font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px}
.hs tr.cur{background:var(--faint)}
.hs em{font-style:normal;color:#f07a2a;font-size:12px}
.hs tfoot tr{border-top:2px solid var(--ink)}
@media (max-width: 560px){ .hs{font-size:12px}.hs th,.hs td{padding:2px 5px}.hs td{font-size:8px}.hs thead th{font-size:10px} }
@media (prefers-reduced-motion: reduce){ .card.pop,.opt.shake,.flash{animation:none} }
.opts.long .opt{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1.3}
.opts.long .opt b{font-family:"Press Start 2P",ui-monospace,monospace}
@media (max-width: 560px){ .opts.long .opt{font-size:13px} }
@media (max-height: 520px) and (min-aspect-ratio: 5/4){ .opts.long .opt{font-size:13px} }
.tabs{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.modes{display:flex}
.modes button{font:inherit;font-size:9px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);padding:7px 10px;cursor:pointer}
.modes button + button{border-left:0}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.learning .gameonly{visibility:hidden}
.lnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lnav [hidden]{display:none}
#learnText{line-height:1.5}
.learning .main{grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr)}
.learning #learnTitle{font-size:clamp(17px,1.7vw,24px)}
.learning #learnText{font-size:clamp(18px,1.1vw + 9px,24px);line-height:1.55;margin-top:10px}
#learnText p{margin:0 0 .6em}
#learnText b{font-weight:700;background:var(--faint);padding:0 .2em;border-radius:2px}
.gate{font-size:15px;max-width:42ch}
@media (max-width: 600px), (max-aspect-ratio: 5/4){ .learning .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(150px,42%) minmax(0,1fr)} }
@media (max-width: 560px){ .learning #learnText{font-size:17px} .learning #learnTitle{font-size:16px} }
@media (max-height: 520px) and (min-aspect-ratio: 5/4){ .learning #learnText{font-size:16px} .learning .main{grid-template-columns:minmax(0,1fr) minmax(300px,1fr)} }
@media (max-width: 560px){ .tabs{width:100%;gap:6px} .tabs .levels{flex:1;width:auto} .modes button{font-size:8px;padding:6px 6px} .lnav{margin-top:10px} }
@media (max-height: 520px) and (min-aspect-ratio: 5/4){ .modes button{font-size:8px;padding:4px 6px} }
.bar{position:relative}
.bar::after{content:"";position:absolute;right:-6px;top:2px;width:4px;height:4px;background:var(--ink)}
.who{font-size:9px;margin-left:auto;margin-right:8px;padding:5px 7px;border:2px dashed var(--soft)}
.who[hidden]{display:none}
.msg input.name{pointer-events:auto;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;width:16em;max-width:70vw;padding:8px 10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:0}
.msg .err{color:#d94040}
.msg .note{border:2px solid #3fae6a}
.msg .cnbig{font-family:"Press Start 2P",ui-monospace,monospace;font-size:clamp(16px,3.6vw,30px);line-height:1.5;margin:10px 0 12px;padding:10px 16px;background:var(--bg);border:3px solid var(--ink);color:#2f8fd1}
.msg .cn{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;margin:2px 0 6px;background:var(--bg);padding:4px 10px;border:2px solid var(--ink)}
.msg .cn span{font-size:13px}
.msg .cn b{font-family:"Press Start 2P",ui-monospace,monospace;font-weight:400;font-size:clamp(10px,1.8vw,14px);line-height:1.6;color:#2f8fd1}
.msg .btn.mini{font-size:8px;padding:4px 6px}
.msg .lb{margin:0 0 2px;font-size:13px;background:var(--bg);padding:0 8px}
.msg .keys{font-size:13px;opacity:.75}
sup.pw{font-size:.8em;line-height:0;vertical-align:.5em}
.pwr{white-space:nowrap}
.opts.long .opt sup.pw{font-size:.8em}
@media (max-width: 560px){ .who{margin-left:0} }
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1 class="pix">Dr Benson's Prefix Panic</h1>
    <div class="who pix" id="who" hidden></div>
    <div class="tabs">
    <nav class="modes pix" id="modes" aria-label="Mode">
      <button type="button" data-mode="play" aria-pressed="true">Play</button>
      <button type="button" data-mode="learn" aria-pressed="false">Learn</button>
    </nav>
    <nav class="levels pix" id="levels" aria-label="Levels">
      <button type="button" data-lv="1"><i style="background:#b87333"></i>Bronze</button>
      <button type="button" data-lv="2"><i style="background:#a3a8ae"></i>Silver</button>
      <button type="button" data-lv="3"><i style="background:#d9a514"></i>Gold</button>
      <button type="button" data-lv="4"><i style="background:#4fc3e8"></i>Diamond</button>
    </nav>
    </div>
  </div>
  <div class="hud pix">
    <div><span id="barLabel">Speed</span><div class="bar" aria-hidden="true"><i id="barFill"></i></div><span id="count">0/0</span></div>
    <div class="gameonly"><span class="lives" id="lives" role="img" aria-label="3 lives left"></span><span>Score</span><span id="score">0</span><span class="streak" id="streak"></span></div>
    <div class="gameonly"><span id="best">High 0</span><span id="clock">00:00</span></div>
  </div>

  <div class="main idle" id="main">
    <div class="stage" id="stage" aria-label="An asteroid field, with Dinosaurus Vex flying his ship in the middle.">
      <canvas id="game"></canvas>
      <div class="msg" id="msg"></div>
    </div>

  <section class="quiz" id="quiz" hidden>
    <div class="card" id="card">
      <div class="clue">
        <span class="step pix"><span id="stepNo"></span><span class="tries" id="tries"></span></span>
        <p class="cv pix" id="clue"></p>
        
      </div>
      <p class="ask" id="ask"></p>
      <div class="opts" id="opts">
        <button class="opt" type="button" data-i="0"><b style="background:#2f8fd1">A</b><span></span></button>
        <button class="opt" type="button" data-i="1"><b style="background:#e8508a">B</b><span></span></button>
        <button class="opt" type="button" data-i="2"><b style="background:#f07a2a">C</b><span></span></button>
        <button class="opt" type="button" data-i="3"><b style="background:#8a5cd1">D</b><span></span></button>
      </div>
      <p class="fb" id="fb" aria-live="polite"></p>
      <div class="go" id="go" hidden aria-hidden="true"><div class="cd"><i id="cdFill"></i></div></div>
    </div>
  </section>
  <section class="quiz" id="learn" hidden aria-live="polite">
    <div class="card" id="learnCard">
      <div class="clue"><span class="step pix"><span id="learnStep"></span></span><p class="cv pix" id="learnTitle"></p></div>
      <div id="learnText"></div>
      <div class="lnav">
        <button class="btn ghost" type="button" id="lBack">Back</button>
        <button class="btn" type="button" id="lNext">Next</button>
        <button class="btn ghost" type="button" id="lAgain" hidden>Start again</button>
      </div>
    </div>
  </section>
  </div>
  <input type="file" id="loadIn" accept=".sav,text/plain" hidden>
</main>

<script>
// Online leaderboard: paste the Apps Script web app URL (ends in /exec) between the quotes.
// Leave it empty and the game never goes online. This is the only network call in the series.
const LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbxRko_q7XHVct4crGP3Y6nNXK4w1B9W-TOrziKBcttSi_WR7-Pp78Iy7R5HRm66UorExw/exec';
(() => {
let W = 600, H = 340, P = 2;
const PAL = ['#e8508a', '#f2c230', '#2f8fd1', '#3fae6a', '#f07a2a'];
const OPT_COL = ['#2f8fd1', '#e8508a', '#f07a2a', '#8a5cd1'], GOOD = '#3fae6a', RED = '#d94040', GOLDC = '#d9a514';
const RAINBOW = ['#d94040', '#f07a2a', '#f2c230', '#3fae6a', '#2f8fd1', '#8a5cd1'];
const LETTERS = 'ABCD';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
const msg = $('msg'), quiz = $('quiz'), mainEl = $('main');
const showQuiz = on => { quiz.hidden = !on; mainEl.classList.toggle('idle', !on); };
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let rocks = [];

/* ---------- colours ---------- */
let C = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ['bg', 'ink', 'soft', 'faint', 'sail']) C[k] = s.getPropertyValue('--' + k).trim();
}
readColors();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) {}
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- sizing ---------- */
let scale = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function resize() {
  const w = Math.floor(stage.clientWidth), h = Math.floor(stage.clientHeight);
  if (!w || !h) return;
  W = w; H = h;
  P = W > 900 && H > 480 ? 3 : 2;
  scale = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  for (const R of rocks) if (!R.decor) { R.x = clamp(R.x, R.rc, Math.max(R.rc, W - R.rc)); R.y = clamp(R.y, R.rc, Math.max(R.rc, H - R.rc)); R.tx = clamp(R.tx, R.rc, Math.max(R.rc, W - R.rc)); R.ty = clamp(R.ty, R.rc, Math.max(R.rc, H - R.rc)); }
  if (typeof draw === 'function') draw();
}
new ResizeObserver(() => resize()).observe(stage);

/* ---------- sound ---------- */
let actx = null, soundOn = true;
function beep(f, d, type = 'square', vol = .045) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(g).connect(actx.destination); o.start(n); o.stop(n + d);
  } catch (e) {}
}
const fmtT = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/*GEN-START*/
/* ---------- numbers, prefixes and the question bank ---------- */
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
// Unicode superscripts are tiny (and missing from the pixel font), so powers of ten are drawn as real superscripts

$('lAgain').addEventListener('click', () => enterStep(0));

$('loadIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadSav(rd.result);
  rd.onerror = () => { savedNote = '<p class="small err">Sorry, that file couldn’t be read.</p>'; goLevel(game.lv); };
  rd.readAsText(f);
});
showWho();
resize();
showIntro();
requestAnimationFrame(frame);
})();
